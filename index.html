<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Workbench</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 40px auto; }
    .btn { padding: 6px 10px; margin: 0; }
  </style>
</head>
<body>
  <h1>Welcome to My Workbench</h1>
  <p>Today: <span id="date"></span></p>
  <div>
    <button class="btn">Write Report</button>
    <button class="btn">Search</button>
    <button class="btn">New Issue</button>
  </div>
  <h2>TO DO</h2>
  <ul>
    <li>Finish README</li>
    <li>Check email</li>
  </ul>
  <script>
    document.getElementById('date').textContent = new Date().toLocaleDateString();
  </script>
</body>
</html>
